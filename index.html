<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casa 🏠 - Multi Task</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F5F4F0; --card: #FFFFFF; --primary: #1C1C2E; --accent: #FF4757;
            --text: #1C1C2E; --muted: #9A9A9A; --border: #EBEBEB;
            --cat-super: #FF4757; --cat-casa: #2ED573; --cat-eventos: #FFA502; --cat-urgente: #FF2D55;
            --u-mati: #4A90E2; --u-lis: #E84393; --u-agus: #9B59B6; --u-mia: #2ECC71;
            --radius: 18px; --shadow: 0 4px 20px rgba(0,0,0,0.07);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overscroll-behavior: none; }

        /* HEADER */
        .header { background: var(--primary); padding: 18px 16px 14px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
        .avatar { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; border: 2px solid rgba(255,255,255,0.15); }
        .header-info { flex: 1; color: white; }
        .header-name { font-size: 20px; font-weight: 900; }
        .header-actions { display: flex; gap: 8px; }
        .btn-icon-header { background: rgba(255,255,255,0.12); border: none; border-radius: 12px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }

        /* CALENDARIO COMPACTO */
        .cal-container { background: white; margin: 10px; border-radius: var(--radius); padding: 15px; box-shadow: var(--shadow); }
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: 900; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
        .cal-day { padding: 8px 0; border-radius: 8px; font-size: 13px; font-weight: 700; position: relative; }
        .cal-day.has-note::after { content: ''; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; background: var(--accent); border-radius: 50%; }
        .cal-day.selected { background: var(--primary); color: white; }
        .cal-day-name { font-size: 9px; color: var(--muted); font-weight: 800; margin-bottom: 5px; }

        /* FILTROS */
        .filtros { display: flex; gap: 8px; overflow-x: auto; padding: 10px 15px; background: white; border-bottom: 1px solid var(--border); scrollbar-width: none; }
        .filtros::-webkit-scrollbar { display: none; }
        .chip { flex-shrink: 0; padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--border); font-size: 12px; font-weight: 700; background: #f9f9f9; }
        .chip.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* TABLERO */
        .tablero { padding: 15px; display: flex; flex-direction: column; gap: 12px; padding-bottom: 100px; }
        .nota { background: white; border-radius: var(--radius); padding: 15px; box-shadow: var(--shadow); border-left: 5px solid #ccc; }
        .nota-user { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 10px; color: white; display: inline-block; margin-bottom: 8px; }
        .nota-content { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
        .nota-date { font-size: 11px; font-weight: 800; color: var(--accent); margin-bottom: 10px; }
        
        /* FOOTER NOTA */
        .nota-foot { display: flex; gap: 8px; border-top: 1px solid #eee; padding-top: 10px; }
        .btn-check { flex: 1; background: #E8FDF0; border: none; padding: 10px; border-radius: 10px; color: #2ED573; font-weight: 800; font-size: 13px; }
        .btn-del { background: #FFEBEB; border: none; padding: 10px 15px; border-radius: 10px; color: var(--accent); }

        /* MODALES */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; align-items: flex-end; }
        .modal.open { display: flex; }
        .modal-sheet { background: white; width: 100%; border-radius: 22px 22px 0 0; padding: 20px; max-height: 85vh; overflow-y: auto; }
        
        /* FORM */
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 12px; border: 1.5px solid var(--border); font-family: inherit; font-weight: 700; background: #f9f9f9; }
        .btn-main { width: 100%; padding: 16px; border-radius: 14px; border: none; background: var(--primary); color: white; font-weight: 900; font-size: 16px; margin-top: 10px; }
        .btn-wa { width: 100%; padding: 16px; border-radius: 14px; border: none; background: #25D366; color: white; font-weight: 900; margin-top: 10px; }

        /* FAB */
        .fab { position: fixed; bottom: 20px; right: 20px; width: 62px; height: 62px; border-radius: 50%; background: var(--accent); color: white; border: none; font-size: 32px; box-shadow: 0 5px 15px rgba(255,71,87,0.4); z-index: 90; }

        .hidden { display: none; }
        .u-mati { background: var(--u-mati); } .u-lis { background: var(--u-lis); } 
        .u-agus { background: var(--u-agus); } .u-mia { background: var(--u-mia); }
    </style>
</head>
<body>

<div id="app">
    <div class="header">
        <div class="avatar" id="avatar">?</div>
        <div class="header-info">
            <div id="user-name" style="font-weight:900;">Cargando...</div>
        </div>
        <div class="header-actions">
            <button class="btn-icon-header" onclick="abrirExport()">📤</button>
            <button class="btn-icon-header" onclick="toggleVista()">📅</button>
        </div>
    </div>

    <div id="vista-calendario" class="hidden">
        <div class="cal-container">
            <div class="cal-header">
                <button onclick="changeMonth(-1)" style="border:none; background:none; font-size:20px;">‹</button>
                <div id="cal-title">Mes Año</div>
                <button onclick="changeMonth(1)" style="border:none; background:none; font-size:20px;">›</button>
            </div>
            <div class="cal-grid" id="cal-grid"></div>
        </div>
    </div>

    <div class="filtros" id="filtros-cat">
        <button class="chip active" onclick="filtrar('todas')">Todas</button>
        <button class="chip" onclick="filtrar('super')">🛒 Súper</button>
        <button class="chip" onclick="filtrar('eventos')">🎉 Eventos</button>
        <button class="chip" onclick="filtrar('urgente')">🚨 Urgente</button>
        <button class="chip" onclick="filtrar('casa')">🏠 Casa</button>
    </div>

    <div id="tablero" class="tablero"></div>
    <button class="fab" onclick="abrirNueva()">＋</button>
</div>

<div class="modal" id="modal-nota">
    <div class="modal-sheet">
        <h2 id="m-titulo" style="margin-bottom:10px">Nueva Nota</h2>
        <input type="hidden" id="f-id">
        <select id="f-cat">
            <option value="casa">🏠 Casa</option>
            <option value="super">🛒 Súper</option>
            <option value="eventos">🎉 Eventos</option>
            <option value="urgente">🚨 Urgente</option>
        </select>
        <textarea id="f-txt" placeholder="¿Qué hay que hacer?"></textarea>
        <input type="date" id="f-fecha">
        <button class="btn-main" onclick="guardar()">Guardar</button>
        <button onclick="cerrarModal('modal-nota')" style="width:100%; border:none; background:none; padding:15px; color:var(--muted); font-weight:700;">Cancelar</button>
    </div>
</div>

<div class="modal" id="modal-export">
    <div class="modal-sheet">
        <h2>📤 Exportar Notas</h2>
        <p style="font-size:13px; color:var(--muted); margin-bottom:15px;">Se enviarán todas las notas visibles por WhatsApp.</p>
        <div id="lista-previa" style="max-height:200px; overflow-y:auto; background:#f5f5f5; padding:10px; border-radius:10px; font-size:13px;"></div>
        <button class="btn-wa" onclick="enviarWA()">💬 Enviar a WhatsApp</button>
        <button onclick="cerrarModal('modal-export')" style="width:100%; border:none; background:none; padding:15px; color:var(--muted); font-weight:700;">Cerrar</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDG6icP-ZCbtMouvxb90OwI1cmse56fnjs",
        authDomain: "app-family-notas.firebaseapp.com",
        databaseURL: "https://app-family-notas-default-rtdb.firebaseio.com",
        projectId: "app-family-notas",
        storageBucket: "app-family-notas.firebasestorage.app",
        messagingSenderId: "1043185917487",
        appId: "1:1043185917487:web:5ec89f80b6f726e99270da"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const userKey = (new URLSearchParams(window.location.search).get('u') || '').toLowerCase();
    const esAdmin = (userKey === 'mati' || userKey === 'lis');
    const perfiles = { mati: '👨🏻‍💻', lis: '👩🏻‍🍳', agus: '👧🏻', mia: '👩🏻‍🎓' };

    let notas = [];
    let filtroActual = 'todas';
    let fechaFiltro = null;
    let vMes = new Date().getMonth();
    let vAnio = new Date().getFullYear();

    if(perfiles[userKey]) {
        document.getElementById('user-name').innerText = userKey.toUpperCase();
        document.getElementById('avatar').innerText = perfiles[userKey];
        onValue(ref(db, 'pendientes'), (s) => {
            const data = s.val();
            notas = data ? Object.keys(data).map(id => ({id, ...data[id]})) : [];
            render();
        });
    }

    window.toggleVista = () => {
        const v = document.getElementById('vista-calendario');
        v.classList.toggle('hidden');
        fechaFiltro = null;
        render();
    };

    window.filtrar = (cat) => {
        filtroActual = cat;
        fechaFiltro = null;
        document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.innerText.toLowerCase().includes(cat)));
        render();
    };

    function render() {
        const tab = document.getElementById('tablero');
        let filtradas = notas.filter(n => (filtroActual === 'todas' || n.categoria === filtroActual));
        
        if(fechaFiltro) {
            filtradas = filtradas.filter(n => n.limite === fechaFiltro);
        }

        tab.innerHTML = filtradas.map(n => `
            <div class="nota" style="border-left-color: var(--cat-${n.categoria})">
                <span class="nota-user u-${n.autor}">${n.autor}</span>
                <div class="nota-content" onclick="editar('${n.id}')">${n.contenido}</div>
                ${n.limite ? `<div class="nota-date">📅 ${n.limite}</div>` : ''}
                <div class="nota-foot">
                    ${esAdmin ? `
                        <button class="btn-check" onclick="borrar('${n.id}')">✅ Listo</button>
                        <button class="btn-del" onclick="borrar('${n.id}')">🗑️</button>
                    ` : `<div style="font-size:11px; color:var(--muted)">🔒 Solo Papá o Mamá</div>`}
                </div>
            </div>
        `).join('');

        renderCalendario();
    }

    window.changeMonth = (dir) => {
        vMes += dir;
        if(vMes < 0) { vMes = 11; vAnio--; }
        if(vMes > 11) { vMes = 0; vAnio++; }
        renderCalendario();
    };

    function renderCalendario() {
        const grid = document.getElementById('cal-grid');
        const tit = document.getElementById('cal-title');
        const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
        tit.innerText = `${meses[vMes]} ${vAnio}`;
        
        grid.innerHTML = ['D','L','M','X','J','V','S'].map(d => `<div class="cal-day-name">${d}</div>`).join('');
        const inicio = new Date(vAnio, vMes, 1).getDay();
        const dias = new Date(vAnio, vMes + 1, 0).getDate();

        for(let i=0; i<inicio; i++) grid.innerHTML += `<div></div>`;
        for(let d=1; d<=dias; d++) {
            const f = `${vAnio}-${String(vMes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const tiene = notas.some(n => n.limite === f);
            grid.innerHTML += `<div class="cal-day ${tiene?'has-note':''} ${fechaFiltro===f?'selected':''}" onclick="selFecha('${f}')">${d}</div>`;
        }
    }

    window.selFecha = (f) => {
        fechaFiltro = (fechaFiltro === f) ? null : f;
        render();
    }

    window.abrirNueva = () => {
        document.getElementById('f-id').value = "";
        document.getElementById('f-txt').value = "";
        document.getElementById('m-titulo').innerText = "Nueva Nota";
        document.getElementById('modal-nota').classList.add('open');
    };

    window.editar = (id) => {
        const n = notas.find(x => x.id === id);
        document.getElementById('f-id').value = n.id;
        document.getElementById('f-txt').value = n.contenido;
        document.getElementById('f-fecha').value = n.limite || "";
        document.getElementById('m-titulo').innerText = "Editar Nota";
        document.getElementById('modal-nota').classList.add('open');
    };

    window.guardar = () => {
        const id = document.getElementById('f-id').value;
        const data = {
            contenido: document.getElementById('f-txt').value,
            categoria: document.getElementById('f-cat').value,
            limite: document.getElementById('f-fecha').value,
            autor: userKey
        };
        if(!data.contenido) return alert("Escribe algo");
        id ? update(ref(db, `pendientes/${id}`), data) : push(ref(db, 'pendientes'), data);
        cerrarModal('modal-nota');
    };

    window.borrar = (id) => { if(confirm("¿Eliminar nota?")) remove(ref(db, `pendientes/${id}`)); };
    window.cerrarModal = (id) => document.getElementById(id).classList.remove('open');

    // EXPORTACIÓN
    window.abrirExport = () => {
        const prev = document.getElementById('lista-previa');
        const visibles = notas.filter(n => (filtroActual === 'todas' || n.categoria === filtroActual));
        prev.innerHTML = visibles.map(n => `• ${n.contenido} (${n.autor})`).join('<br>');
        document.getElementById('modal-export').classList.add('open');
    };

    window.enviarWA = () => {
        const visibles = notas.filter(n => (filtroActual === 'todas' || n.categoria === filtroActual));
        let msj = `🏠 *NOTAS DE CASA*\n_Categoría: ${filtroActual}_\n\n`;
        visibles.forEach(n => msj += `✅ ${n.contenido} (${n.autor})\n`);
        window.open(`https://wa.me/?text=${encodeURIComponent(msj)}`);
    };
</script>
</body>
</html>
