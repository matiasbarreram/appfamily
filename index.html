<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casa 🏠</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* MANTENGO TUS RAÍCES Y ESTILOS EXACTOS */
        :root {
            --bg: #F5F4F0; --card: #FFFFFF; --primary: #1C1C2E; --accent: #FF4757;
            --text: #1C1C2E; --muted: #9A9A9A; --border: #EBEBEB;
            --cat-super: #FF4757; --cat-casa: #2ED573; --cat-comida: #FF6B81;
            --cat-colegio: #5352ED; --cat-medico: #1E90FF; --cat-pagos: #FFA502;
            --cat-mascota: #A29BFE; --cat-trabajo: #636E72; --cat-eventos: #FDCB6E;
            --cat-urgente: #FF2D55; --cat-panoramas:#00CEC9;
            --u-mati: #4A90E2; --u-lis: #E84393; --u-agus: #9B59B6; --u-mia: #2ECC71;
            --radius: 18px; --shadow: 0 4px 20px rgba(0,0,0,0.07);
        }

        /* [TODOS TUS ESTILOS ORIGINALES SE MANTIENEN IGUAL] */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overscroll-behavior: none; }
        #access-denied { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; gap: 10px; background: var(--primary); color: white; }
        #app { display: none; }

        /* HEADER */
        .header { background: var(--primary); padding: 18px 16px 14px; display: flex; align-items: center; gap: 12px; }
        .avatar { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; border: 2px solid rgba(255,255,255,0.15); }
        .header-info { flex: 1; }
        .header-saludo { font-size: 11px; color: rgba(255,255,255,0.5); text-transform: uppercase; }
        .header-name { font-size: 22px; font-weight: 900; color: white; }
        .header-actions { display: flex; gap: 8px; }
        .btn-icon-header { background: rgba(255,255,255,0.12); border: none; border-radius: 12px; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }

        /* ESTILOS NUEVOS PARA EL CALENDARIO (Agregados sin romper lo anterior) */
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; margin-top: 10px; }
        .cal-day-name { font-size: 10px; font-weight: 800; color: var(--muted); }
        .cal-day { padding: 10px 0; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; position: relative; border: 1px solid transparent; }
        .cal-day.has-note::after { content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; background: var(--accent); border-radius: 50%; }
        .cal-day.selected { background: var(--primary); color: white; }

        /* RESTO DE TUS ESTILOS (STATS, FILTROS, NOTAS, MODALES, ETC) */
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--primary); border-top: 1px solid rgba(255,255,255,0.08); padding: 0 8px 16px; gap: 6px; }
        .stat { background: rgba(255,255,255,0.08); border-radius: 12px; padding: 10px 6px; text-align: center; }
        .stat-n { font-size: 22px; font-weight: 900; color: white; }
        .stat-l { font-size: 9px; color: rgba(255,255,255,0.45); text-transform: uppercase; }
        
        .filtros-wrap { background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; }
        .filtros-row { display: flex; gap: 6px; overflow-x: auto; padding: 10px 14px; scrollbar-width: none; }
        .chip { flex-shrink: 0; padding: 7px 14px; border-radius: 20px; border: 1.5px solid var(--border); background: #F8F8F8; font-weight: 700; font-size: 12px; cursor: pointer; }
        .chip.active { background: var(--primary); color: white; }
        
        .autor-row { display: flex; gap: 6px; padding: 0 14px 10px; overflow-x: auto; }
        .chip-autor { flex-shrink: 0; padding: 5px 12px; border-radius: 20px; border: 1.5px solid var(--border); background: #F8F8F8; font-weight: 800; font-size: 11px; }
        .chip-autor.active { color: white; background: var(--primary); }

        .tablero { padding: 14px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 110px; }
        .nota { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); border-left: 5px solid #ccc; position: relative; }
        .nota-inner { padding: 14px; }
        .nota-user { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 10px; color: white; display: inline-block; }
        .nota-contenido { font-size: 16px; font-weight: 700; margin: 10px 0; }
        .fecha-badge { font-size: 11px; font-weight: 800; padding: 4px 9px; border-radius: 20px; background: #eee; }
        .nota-foot { display: flex; gap: 8px; border-top: 1px solid #F0F0F0; padding-top: 10px; }
        .btn-completar { flex: 1; background: #F0FFF4; border: 1.5px solid #2ED573; color: #2ED573; padding: 9px; border-radius: 10px; font-weight: 800; }
        .btn-borrar-nota { background: #FFF0F0; border: 1.5px solid #FFCDD2; color: var(--accent); padding: 9px 14px; border-radius: 10px; }

        .fab { position: fixed; bottom: 24px; right: 18px; width: 62px; height: 62px; border-radius: 50%; background: var(--accent); color: white; border: none; font-size: 32px; box-shadow: 0 6px 24px rgba(255,71,87,0.4); z-index: 30; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 100; align-items: flex-end; backdrop-filter: blur(2px); }
        .modal-overlay.open { display: flex; }
        .modal-sheet { background: var(--card); width: 100%; border-radius: 22px 22px 0 0; padding: 20px; max-height: 92vh; overflow-y: auto; }
        
        /* TUS ESTILOS DE SELECTOR DE CATEGORÍA Y PRIORIDAD */
        .cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .cat-opt { padding: 10px; border-radius: 12px; border: 2px solid var(--border); text-align: center; }
        .cat-opt.selected { border-color: var(--primary); background: var(--primary); color: white; }
        .prior-row { display: flex; gap: 8px; }
        .prior-opt { flex: 1; padding: 10px; border-radius: 12px; border: 2px solid var(--border); text-align: center; font-weight: 800; }
        .prior-opt.selected { background: var(--primary); color: white; }

        textarea, input[type="date"] { width: 100%; padding: 12px; border-radius: 12px; border: 1.5px solid var(--border); margin: 8px 0; font-family: inherit; font-weight: 700; }
        .btn-main { width: 100%; padding: 16px; border-radius: 14px; background: var(--primary); color: white; font-weight: 900; border: none; margin-top: 10px; }
        
        /* MODO SÚPER CHECKBOXES */
        .super-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #eee; }
        .super-checkbox { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border); }
        .super-item.tachado { opacity: 0.5; text-decoration: line-through; }
    </style>
</head>
<body>

<div id="access-denied">
    <div style="font-size:60px">🔒</div>
    <h2>Acceso Privado</h2>
    <p>Pedile tu link a Mati 😄</p>
</div>

    <div class="header">
        <div class="avatar" id="
