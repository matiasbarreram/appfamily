<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casa 🏠</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F5F4F0; --card: #FFFFFF; --primary: #1C1C2E; --accent: #FF4757;
            --text: #1C1C2E; --muted: #9A9A9A; --border: #EBEBEB;
            --cat-super: #FF4757; --cat-casa: #2ED573; --cat-comida: #FF6B81;
            --cat-colegio: #5352ED; --cat-medico: #1E90FF; --cat-pagos: #FFA502;
            --cat-mascota: #A29BFE; --cat-trabajo: #636E72; --cat-eventos: #FDCB6E;
            --cat-urgente: #FF2D55; --cat-panoramas:#00CEC9;
            --u-mati: #4A90E2; --u-lis: #E84393; --u-agus: #9B59B6; --u-mia: #2ECC71;
            --radius: 18px; --shadow: 0 4px 20px rgba(0,0,0,0.07);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overscroll-behavior: none; }

        #access-denied { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; gap: 10px; background: var(--primary); color: white; }
        #app { display: none; }

        /* HEADER */
        .header { background: var(--primary); padding: 18px 16px 14px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
        .avatar { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; border: 2px solid rgba(255,255,255,0.15); }
        .header-info { flex: 1; color: white; }
        .header-name { font-size: 22px; font-weight: 900; }
        .header-actions { display: flex; gap: 8px; }
        .btn-icon-header { background: rgba(255,255,255,0.12); border: none; border-radius: 12px; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }

        /* CALENDARIO MODAL */
        .cal-container { padding: 10px; }
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: 900; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .cal-day-name { font-size: 10px; color: var(--muted); font-weight: 800; margin-bottom: 5px; }
        .cal-day { padding: 10px 0; border-radius: 10px; font-size: 14px; font-weight: 700; position: relative; cursor: pointer; border: 1px solid transparent; }
        .cal-day.has-note::after { content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; background: var(--accent); border-radius: 50%; }
        .cal-day.selected { background: var(--primary); color: white; }
        .cal-day.today { border-color: var(--accent); color: var(--accent); }

        /* FILTROS */
        .filtros-wrap { background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 74px; z-index: 20; }
        .filtros-row, .autor-row { display: flex; gap: 6px; overflow-x: auto; padding: 10px 14px; scrollbar-width: none; }
        .filtros-row::-webkit-scrollbar { display: none; }
        .chip { flex-shrink: 0; padding: 7px 14px; border-radius: 20px; border: 1.5px solid var(--border); background: #F8F8F8; font-weight: 700; font-size: 12px; cursor: pointer; }
        .chip.active { background: var(--primary); color: white; border-color: var(--primary); }
        .chip-autor { flex-shrink: 0; padding: 5px 12px; border-radius: 20px; border: 1.5px solid var(--border); background: #F8F8F8; font-weight: 800; font-size: 11px; cursor: pointer; }
        .chip-autor.active { color: white; border-color: transparent; }
        #chip-mati.active { background: var(--u-mati); } #chip-lis.active { background: var(--u-lis); }
        #chip-agus.active { background: var(--u-agus); } #chip-mia.active { background: var(--u-mia); }

        /* TABLERO */
        .tablero { padding: 14px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 110px; }
        .nota { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; border-left: 5px solid #ccc; }
        .nota-inner { padding: 14px; }
        .nota-user { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 10px; color: white; display: inline-block; margin-bottom: 8px; }
        .nota-contenido { font-size: 16px; font-weight: 700; line-height: 1.4; margin-bottom: 10px; }
        .fecha-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; padding: 4px 9px; border-radius: 20px; background: #eee; }
        .nota-foot { display: flex; gap: 8px; border-top: 1px solid #F0F0F0; padding-top: 10px; margin-top: 10px; }
        .btn-completar { flex: 1; background: #F0FFF4; border: 1.5px solid #2ED573; border-radius: 10px; padding: 9px; color: #2ED573; font-weight: 800; cursor: pointer; }
        .btn-borrar { background: #FFF0F0; border: 1.5px solid #FFCDD2; border-radius: 10px; padding: 9px 14px; color: var(--accent); cursor: pointer; }

        /* MODALES */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 1000; align-items: flex-end; backdrop-filter: blur(2px); }
        .modal-overlay.open { display: flex; }
        .modal-sheet { background: white; width: 100%; border-radius: 22px 22px 0 0; padding: 20px; max-height: 90vh; overflow-y: auto; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        input, textarea, select { width: 100%; padding: 13px; margin: 8px 0; border-radius: 12px; border: 1.5px solid var(--border); font-family: inherit; font-weight: 700; background: #F9F9F9; }
        .btn-main { width: 100%; padding: 16px; border-radius: 14px; border: none; background: var(--primary); color: white; font-weight: 900; font-size: 16px; margin-top: 10px; cursor: pointer; }
        .fab { position: fixed; bottom: 24px; right: 18px; width: 62px; height: 62px; border-radius: 50%; background: var(--accent); color: white; border: none; font-size: 32px; box-shadow: 0 6px 24px rgba(255,71,87,0.4); z-index: 30; cursor: pointer; }
    </style>
</head>
<body>

<div id="access-denied">
    <div style="font-size:60px">🔒</div>
    <h2>Acceso Privado</h2>
    <p>Pedile tu link a Mati 😄</p>
</div>

<div id="app">
    <div class="header">
        <div class="avatar" id="avatar">?</div>
        <div class="header-info">
            <div class="header-name" id="header-name">Cargando...</div>
        </div>
        <div class="header-actions">
            <button class="btn-icon-header" onclick="abrirModal('modal-export')">📤</button>
            <button class="btn-icon-header" onclick="abrirModal('modal-calendar')">📅</button>
            <button class="btn-icon-header" onclick="filtrarCategoria('super')">🛒</button>
        </div>
    </div>

    <div class="filtros-wrap">
        <div class="filtros-row">
            <button class="chip active" onclick="filtrarCategoria('todas', this)">Todas</button>
            <button class="chip" onclick="filtrarCategoria('super', this)">🛒 Súper</button>
            <button class="chip" onclick="filtrarCategoria('urgente', this)">🚨 Urgente</button>
            <button class="chip" onclick="filtrarCategoria('casa', this)">🏠 Casa</button>
            <button class="chip" onclick="filtrarCategoria('pagos', this)">💰 Pagos</button>
        </div>
        <div class="autor-row">
            <button class="chip-autor active" onclick="filtrarAutor('todas', this)">Todos</button>
            <button class="chip-autor" id="chip-mati" onclick="filtrarAutor('mati', this)">👨🏻‍💻 Mati</button>
            <button class="chip-autor" id="chip-lis" onclick="filtrarAutor('lis', this)">👩🏻‍🍳 Lis</button>
            <button class="chip-autor" id="chip-agus" onclick="filtrarAutor('agus', this)">👧🏻 Agus</button>
            <button class="chip-autor" id="chip-mia" onclick="filtrarAutor('mia', this)">👩🏻‍🎓 Mia</button>
        </div>
    </div>

    <div id="tablero" class="tablero"></div>
    <button class="fab" onclick="abrirModal('modal-nota')">＋</button>
</div>

<div class="modal-overlay" id="modal-calendar">
    <div class="modal-sheet">
        <div class="cal-container">
            <div class="cal-header">
                <button onclick="cambiarMes(-1)" style="border:none; background:none; font-size:20px;">‹</button>
                <div id="cal-mes-anio">Mes Año</div>
                <button onclick="cambiarMes(1)" style="border:none; background:none; font-size:20px;">›</button>
            </div>
            <div class="cal-grid" id="cal-grid"></div>
        </div>
        <button class="btn-main" onclick="cerrarModal('modal-calendar')" style="background:#eee; color:#666;">Cerrar</button>
    </div>
</div>

<div class="modal-overlay" id="modal-nota">
    <div class="modal-sheet">
        <h2>Nueva Nota</h2>
        <select id="f-cat">
            <option value="casa">🏠 Casa</option>
            <option value="super">🛒 Súper</option>
            <option value="urgente">🚨 Urgente</option>
            <option value="pagos">💰 Pagos</option>
        </select>
        <textarea id="f-txt" placeholder="¿Qué hay que hacer?"></textarea>
        <input type="date" id="f-fecha">
        <button class="btn-main" onclick="guardar()">🚀 Publicar Nota</button>
        <button class="btn-main" onclick="cerrarModal('modal-nota')" style="background:#eee; color:#666; margin-top:5px;">Cancelar</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDG6icP-ZCbtMouvxb90OwI1cmse56fnjs",
        authDomain: "app-family-notas.firebaseapp.com",
        databaseURL: "https://app-family-notas-default-rtdb.firebaseio.com",
        projectId: "app-family-notas",
        storageBucket: "app-family-notas.firebasestorage.app",
        messagingSenderId: "1043185917487",
        appId: "1:1043185917487:web:5ec89f80b6f726e99270da"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const userKey = (new URLSearchParams(window.location.search).get('u') || '').toLowerCase();
    const perfiles = { mati: '👨🏻‍💻', lis: '👩🏻‍🍳', agus: '👧🏻', mia: '👩🏻‍🎓' };

    let notas = [];
    let filtroCat = 'todas';
    let filtroAut = 'todas';
    let filtroFecha = null;
    let fechaNav = new Date();

    if (perfiles[userKey]) {
        document.getElementById("app").style.display = "block";
        document.getElementById("header-name").innerText = userKey.toUpperCase();
        document.getElementById("avatar").innerText = perfiles[userKey];
        
        onValue(ref(db, 'pendientes'), (s) => {
            const data = s.val();
            notas = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
            render();
        });
    } else {
        document.getElementById("access-denied").style.display = "flex";
    }

    function render() {
        const tab = document.getElementById("tablero");
        const filtradas = notas.filter(n => {
            const cOk = filtroCat === 'todas' || n.categoria === filtroCat;
            const aOk = filtroAut === 'todas' || n.autor === filtroAut;
            const fOk = !filtroFecha || n.limite === filtroFecha;
            return cOk && aOk && fOk;
        });

        tab.innerHTML = filtradas.map(n => `
            <div class="nota" style="border-left-color: var(--cat-${n.categoria})">
                <div class="nota-inner">
                    <span class="nota-user u-${n.autor}">${n.autor}</span>
                    <div class="nota-contenido">${n.contenido}</div>
                    ${n.limite ? `<div class="fecha-badge">📅 ${n.limite}</div>` : ''}
                    <div class="nota-foot">
                        <button class="btn-completar" onclick="borrar('${n.id}')">✅ Listo</button>
                        <button class="btn-borrar" onclick="borrar('${n.id}')">🗑️</button>
                    </div>
                </div>
            </div>
        `).join('');
        renderCalendario();
    }

    // CALENDARIO FUNCIONAL
    function renderCalendario() {
        const grid = document.getElementById('cal-grid');
        const tit = document.getElementById('cal-mes-anio');
        const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
        tit.innerText = `${meses[fechaNav.getMonth()]} ${fechaNav.getFullYear()}`;
        
        grid.innerHTML = ['D','L','M','M','J','V','S'].map(d => `<div class="cal-day-name">${d}</div>`).join('');
        const inicio = new Date(fechaNav.getFullYear(), fechaNav.getMonth(), 1).getDay();
        const diasMes = new Date(fechaNav.getFullYear(), fechaNav.getMonth() + 1, 0).getDate();

        for(let i=0; i<inicio; i++) grid.innerHTML += `<div></div>`;
        for(let d=1; d<=diasMes; d++) {
            const fStr = `${fechaNav.getFullYear()}-${String(fechaNav.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const tieneNota = notas.some(n => n.limite === fStr);
            const sel = filtroFecha === fStr ? 'selected' : '';
            grid.innerHTML += `<div class="cal-day ${tieneNota?'has-note':''} ${sel}" onclick="seleccionarFecha('${fStr}')">${d}</div>`;
        }
    }

    window.cambiarMes = (v) => { fechaNav.setMonth(fechaNav.getMonth() + v); renderCalendario(); };
    window.seleccionarFecha = (f) => {
        filtroFecha = (filtroFecha === f) ? null : f;
        if(filtroFecha) cerrarModal('modal-calendar');
        render();
    };

    // FILTROS
    window.filtrarCategoria = (c, btn) => {
        filtroCat = c; filtroFecha = null;
        document.querySelectorAll('.chip').forEach(ch => ch.classList.remove('active'));
        if(btn) btn.classList.add('active');
        render();
    };
    window.filtrarAutor = (a, btn) => {
        filtroAut = a;
        document.querySelectorAll('.chip-autor').forEach(ch => ch.classList.remove('active'));
        btn.classList.add('active');
        render();
    };

    window.guardar = () => {
        const t = document.getElementById('f-txt').value;
        if(!t) return;
        push(ref(db, 'pendientes'), {
            contenido: t,
            categoria: document.getElementById('f-cat').value,
            limite: document.getElementById('f-fecha').value,
            autor: userKey
        });
        document.getElementById('f-txt').value = "";
        cerrarModal('modal-nota');
    };

    window.borrar = (id) => remove(ref(db, `pendientes/${id}`));
    window.abrirModal = (id) => document.getElementById(id).classList.add('open');
    window.cerrarModal = (id) => document.getElementById(id).classList.remove('open');
</script>
</body>
</html>
