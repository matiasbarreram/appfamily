<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casa 🏠 - Multi Task</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F5F4F0; --card: #FFFFFF; --primary: #1C1C2E; --accent: #FF4757;
            --text: #1C1C2E; --muted: #9A9A9A; --border: #EBEBEB;
            --cat-super: #FF4757; --cat-casa: #2ED573; --cat-comida: #FF6B81;
            --cat-colegio: #5352ED; --cat-medico: #1E90FF; --cat-pagos: #FFA502;
            --cat-mascota: #A29BFE; --cat-trabajo: #636E72; --cat-eventos: #FDCB6E;
            --cat-urgente: #FF2D55; --cat-panoramas:#00CEC9;
            --u-mati: #4A90E2; --u-lis: #E84393; --u-agus: #9B59B6; --u-mia: #2ECC71;
            --radius: 18px; --shadow: 0 4px 20px rgba(0,0,0,0.07);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overscroll-behavior: none; }

        /* ── ACCESS DENIED ── */
        #access-denied { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; gap: 10px; background: var(--primary); }
        #access-denied h2 { font-size: 2rem; color: white; }
        #app { display: none; }

        /* ── HEADER ── */
        .header { background: var(--primary); padding: 18px 16px 14px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
        .avatar { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; border: 2px solid rgba(255,255,255,0.15); }
        .header-info { flex: 1; }
        .header-saludo { font-size: 11px; color: rgba(255,255,255,0.5); letter-spacing: 0.5px; text-transform: uppercase; }
        .header-name { font-size: 22px; font-weight: 900; color: white; line-height: 1.1; }
        .header-actions { display: flex; gap: 8px; }
        .btn-icon-header { background: rgba(255,255,255,0.12); border: none; border-radius: 12px; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }

        /* ── CALENDARIO ── */
        .cal-container { background: white; margin: 10px; border-radius: var(--radius); padding: 15px; box-shadow: var(--shadow); }
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: 900; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .cal-day-name { font-size: 10px; color: var(--muted); font-weight: 800; margin-bottom: 5px; }
        .cal-day { padding: 10px 0; border-radius: 10px; font-size: 14px; font-weight: 700; position: relative; cursor: pointer; border: 1px solid transparent; }
        .cal-day.has-note::after { content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; background: var(--accent); border-radius: 50%; }
        .cal-day.selected { background: var(--primary); color: white; }
        .cal-day.today { border-color: var(--accent); color: var(--accent); }

        /* ── FILTROS ── */
        .filtros-wrap { background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 74px; z-index: 20; }
        .filtros-row { display: flex; gap: 6px; overflow-x: auto; padding: 10px 14px; scrollbar-width: none; }
        .filtros-row::-webkit-scrollbar { display: none; }
        .chip { flex-shrink: 0; padding: 7px 14px; border-radius: 20px; border: 1.5px solid var(--border); background: #F8F8F8; font-weight: 700; font-size: 12px; cursor: pointer; }
        .chip.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* ── TABLERO ── */
        .tablero { padding: 14px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 110px; }
        .nota { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; border-left: 5px solid #ccc; transition: 0.2s; }
        .nota-inner { padding: 14px; }
        .nota-user { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 10px; color: white; margin-bottom: 8px; display: inline-block; }
        .u-mati { background: var(--u-mati); } .u-lis { background: var(--u-lis); } 
        .u-agus { background: var(--u-agus); } .u-mia { background: var(--u-mia); }
        .nota-contenido { font-size: 16px; font-weight: 700; line-height: 1.4; margin-bottom: 10px; }
        .fecha-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; padding: 4px 9px; border-radius: 20px; background: #eee; }
        
        .nota-foot { display: flex; gap: 8px; border-top: 1px solid #F0F0F0; padding-top: 10px; margin-top: 10px; }
        .btn-completar { flex: 1; background: #F0FFF4; border: 1.5px solid #2ED573; border-radius: 10px; padding: 9px; color: #2ED573; font-weight: 800; cursor: pointer; }
        .btn-borrar-nota { background: #FFF0F0; border: 1.5px solid #FFCDD2; border-radius: 10px; padding: 9px 14px; color: var(--accent); cursor: pointer; }

        /* ── MODALES ── */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 1000; align-items: flex-end; backdrop-filter: blur(2px); }
        .modal-overlay.open { display: flex; }
        .modal-sheet { background: white; width: 100%; border-radius: 22px 22px 0 0; padding: 20px; max-height: 90vh; overflow-y: auto; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        input, textarea, select { width: 100%; padding: 13px; margin: 8px 0; border-radius: 12px; border: 1.5px solid var(--border); font-family: inherit; font-weight: 700; background: #F9F9F9; }
        .btn-main { width: 100%; padding: 16px; border-radius: 14px; border: none; background: var(--primary); color: white; font-weight: 900; font-size: 16px; margin-top: 10px; cursor: pointer; }
        .btn-wa { background: #25D366; color: white; border: none; width: 100%; padding: 16px; border-radius: 14px; font-weight: 900; margin-top: 10px; cursor: pointer; }
        .fab { position: fixed; bottom: 24px; right: 18px; width: 62px; height: 62px; border-radius: 50%; background: var(--accent); color: white; border: none; font-size: 32px; box-shadow: 0 6px 24px rgba(255,71,87,0.4); z-index: 30; cursor: pointer; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="access-denied">
    <div style="font-size:60px">🔒</div>
    <h2>Acceso Privado</h2>
    <p style="color:white">Pedile tu link a Mati 😄</p>
</div>

<div id="app">
    <div class="header">
        <div class="avatar" id="avatar">?</div>
        <div class="header-info">
            <div class="header-saludo">Hola 👋</div>
            <div class="header-name" id="header-name">Cargando...</div>
        </div>
        <div class="header-actions">
            <button class="btn-icon-header" onclick="abrirExport()">📤</button>
            <button class="btn-icon-header" onclick="toggleCalendario()">📅</button>
            <button class="btn-icon-header" onclick="abrirSuper()">🛒</button>
        </div>
    </div>

    <div id="seccion-calendario" class="hidden">
        <div class="cal-container">
            <div class="cal-header">
                <button onclick="cambiarMes(-1)" style="border:none; background:none; font-size:20px; cursor:pointer;">‹</button>
                <div id="cal-mes-anio">Mes Año</div>
                <button onclick="cambiarMes(1)" style="border:none; background:none; font-size:20px; cursor:pointer;">›</button>
            </div>
            <div class="cal-grid" id="cal-grid"></div>
        </div>
    </div>

    <div class="filtros-wrap">
        <div class="filtros-row" id="chips-cat">
            <button class="chip active" onclick="filtrarCat('todas', this)">Todas</button>
            <button class="chip" onclick="filtrarCat('super', this)">🛒 Súper</button>
            <button class="chip" onclick="filtrarCat('urgente', this)">🚨 Urgente</button>
            <button class="chip" onclick="filtrarCat('casa', this)">🏠 Casa</button>
            <button class="chip" onclick="filtrarCat('colegio', this)">🎓 Colegio</button>
        </div>
    </div>

    <div id="tablero" class="tablero"></div>
    <button class="fab" onclick="abrirModal('modal-nota')">＋</button>
</div>

<div class="modal-overlay" id="modal-nota">
    <div class="modal-sheet">
        <h2 style="margin-bottom:15px">Nueva Nota</h2>
        <select id="f-cat">
            <option value="casa">🏠 Casa</option>
            <option value="super">🛒 Súper</option>
            <option value="urgente">🚨 Urgente</option>
            <option value="colegio">🎓 Colegio</option>
            <option value="pagos">💰 Pagos</option>
        </select>
        <textarea id="f-txt" placeholder="¿Qué hay que hacer?"></textarea>
        <input type="date" id="f-fecha">
        <button class="btn-main" onclick="guardarNota()">🚀 Publicar Nota</button>
        <button class="btn-main" onclick="cerrarModal('modal-nota')" style="background:#eee; color:#666;">Cancelar</button>
    </div>
</div>

<div class="modal-overlay" id="modal-export">
    <div class="modal-sheet">
        <h2>📤 Exportar Notas</h2>
        <div id="export-preview" style="margin:15px 0; font-size:14px; background:#f5f5f5; padding:10px; border-radius:10px;"></div>
        <button class="btn-wa" onclick="enviarWhatsApp()">💬 Enviar a WhatsApp</button>
        <button class="btn-main" onclick="cerrarModal('modal-export')" style="background:#eee; color:#666;">Cerrar</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDG6icP-ZCbtMouvxb90OwI1cmse56fnjs",
        authDomain: "app-family-notas.firebaseapp.com",
        databaseURL: "https://app-family-notas-default-rtdb.firebaseio.com",
        projectId: "app-family-notas",
        storageBucket: "app-family-notas.firebasestorage.app",
        messagingSenderId: "1043185917487",
        appId: "1:1043185917487:web:5ec89f80b6f726e99270da"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const userKey = (new URLSearchParams(window.location.search).get('u') || '').toLowerCase();
    const perfiles = { mati: { n: 'Mati', e: '👨🏻‍💻', bg: '#EBF2FC' }, lis: { n: 'Lis', e: '👩🏻‍🍳', bg: '#FCE8F3' }, agus: { n: 'Agus', e: '👧🏻', bg: '#F0EBF9' }, mia: { n: 'Mia', e: '👩🏻‍🎓', bg: '#E8F9EE' } };

    let notas = [];
    let filtroCatActual = 'todas';
    let filtroFechaActual = null;
    let fechaNav = new Date();

    if (perfiles[userKey]) {
        document.getElementById("app").style.display = "block";
        document.getElementById("header-name").innerText = perfiles[userKey].n;
        document.getElementById("avatar").innerText = perfiles[userKey].e;
        document.getElementById("avatar").style.background = perfiles[userKey].bg;
        
        onValue(ref(db, 'pendientes'), (s) => {
            const d = s.val();
            notas = d ? Object.keys(d).map(k => ({ id: k, ...d[k] })) : [];
            render();
        });
    } else {
        document.getElementById("access-denied").style.display = "flex";
    }

    function render() {
        const tab = document.getElementById("tablero");
        const filtradas = notas.filter(n => {
            const catOk = filtroCatActual === 'todas' || n.categoria === filtroCatActual;
            const fechaOk = !filtroFechaActual || n.limite === filtroFechaActual;
            return catOk && fechaOk;
        });

        tab.innerHTML = filtradas.map(n => `
            <div class="nota" style="border-left-color: var(--cat-${n.categoria})">
                <div class="nota-inner">
                    <span class="nota-user u-${n.autor}">${n.autor}</span>
                    <div class="nota-contenido">${n.contenido}</div>
                    ${n.limite ? `<div class="fecha-badge">📅 ${n.limite}</div>` : ''}
                    <div class="nota-foot">
                        <button class="btn-completar" onclick="borrarNota('${n.id}')">✅ Completada</button>
                        <button class="btn-borrar-nota" onclick="borrarNota('${n.id}')">🗑️</button>
                    </div>
                </div>
            </div>
        `).join('');

        renderCalendario();
    }

    window.toggleCalendario = () => {
        document.getElementById('seccion-calendario').classList.toggle('hidden');
    };

    window.cambiarMes = (dir) => {
        fechaNav.setMonth(fechaNav.getMonth() + dir);
        renderCalendario();
    };

    function renderCalendario() {
        const grid = document.getElementById('cal-grid');
        const tit = document.getElementById('cal-mes-anio');
        const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
        
        tit.innerText = `${meses[fechaNav.getMonth()]} ${fechaNav.getFullYear()}`;
        grid.innerHTML = ['D','L','M','M','J','V','S'].map(d => `<div class="cal-day-name">${d}</div>`).join('');

        const primerDia = new Date(fechaNav.getFullYear(), fechaNav.getMonth(), 1).getDay();
        const diasMes = new Date(fechaNav.getFullYear(), fechaNav.getMonth() + 1, 0).getDate();
        const hoy = new Date().toISOString().split('T')[0];

        for(let i=0; i<primerDia; i++) grid.innerHTML += `<div></div>`;

        for(let d=1; d<=diasMes; d++) {
            const fechaStr = `${fechaNav.getFullYear()}-${String(fechaNav.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const tieneNota = notas.some(n => n.limite === fechaStr);
            const esHoy = hoy === fechaStr;
            const sel = filtroFechaActual === fechaStr ? 'selected' : '';
            
            grid.innerHTML += `
                <div class="cal-day ${tieneNota?'has-note':''} ${esHoy?'today':''} ${sel}" 
                     onclick="filtrarFecha('${fechaStr}')">
                    ${d}
                </div>`;
        }
    }

    window.filtrarFecha = (f) => {
        filtroFechaActual = (filtroFechaActual === f) ? null : f;
        render();
    };

    window.filtrarCat = (c, btn) => {
        filtroCatActual = c;
        document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    };

    window.guardarNota = () => {
        const txt = document.getElementById('f-txt').value;
        if(!txt) return alert("Escribe algo");
        push(ref(db, 'pendientes'), {
            contenido: txt,
            categoria: document.getElementById('f-cat').value,
            limite: document.getElementById('f-fecha').value,
            autor: userKey,
            creado: new Date().toISOString()
        });
        cerrarModal('modal-nota');
        document.getElementById('f-txt').value = "";
    };

    window.borrarNota = (id) => { if(confirm("¿Completado?")) remove(ref(db, `pendientes/${id}`)); };
    window.abrirModal = (id) => document.getElementById(id).classList.add('open');
    window.cerrarModal = (id) => document.getElementById(id).classList.remove('open');

    // EXPORTAR Y WHATSAPP
    window.abrirExport = () => {
        const prev = document.getElementById('export-preview');
        const filtradas = notas.filter(n => filtroCatActual === 'todas' || n.categoria === filtroCatActual);
        prev.innerHTML = filtradas.map(n => `• ${n.contenido}`).join('<br>');
        abrirModal('modal-export');
    };

    window.enviarWhatsApp = () => {
        const filtradas = notas.filter(n => filtroCatActual === 'todas' || n.categoria === filtroCatActual);
        let msj = `🏠 *NOTAS CASA*\n`;
        filtradas.forEach(n => msj += `- ${n.contenido}\n`);
        window.open(`https://wa.me/?text=${encodeURIComponent(msj)}`);
    };

    window.abrirSuper = () => {
        filtrarCat('super', document.querySelector('.chip[onclick*="super"]'));
    };
</script>
</body>
</html>
