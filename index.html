<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Familia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4">
    <div class="max-w-md mx-auto">
        <header class="text-center py-6">
            <h1 id="saludo" class="text-3xl font-bold text-blue-400">Hola Familia 👋</h1>
            <p class="text-slate-400">Lista compartida en tiempo real</p>
        </header>

        <div class="flex gap-2 mb-6">
            <input id="tareaInput" type="text" placeholder="Escribe algo..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500">
            <button onclick="agregarTarea()" class="bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded-xl font-bold">+</button>
        </div>

        <div id="listaTareas" class="space-y-3">
            <p class="text-center text-slate-500">Cargando notas...</p>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DE LA BASE DE DATOS (Pública para pruebas)
        const firebaseConfig = {
            databaseURL: "https://app-familia-mati-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Detectar usuario de la URL
        const u = new URLSearchParams(window.location.search).get('u')?.toLowerCase();
        const nombres = {'mati':'Mati', 'lis':'Lis', 'agus':'Agus', 'mia':'Mia'};
        if(u && nombres[u]) document.getElementById('saludo').innerText = 'Hola ' + nombres[u] + ' 👋';

        // FUNCIÓN: Agregar tarea a la base de datos
        function agregarTarea() {
            const input = document.getElementById('tareaInput');
            if (input.value.trim() === "") return;

            db.ref('tareas').push({
                texto: input.value,
                autor: nombres[u] || 'Alguien',
                fecha: Date.now()
            });
            input.value = "";
        }

        // FUNCIÓN: Leer tareas en tiempo real
        db.ref('tareas').on('value', (snapshot) => {
            const lista = document.getElementById('listaTareas');
            lista.innerHTML = "";
            const data = snapshot.val();

            if (data) {
                Object.keys(data).reverse().forEach(key => {
                    const t = data[key];
                    lista.innerHTML += `
                        <div class="bg-slate-800 p-4 rounded-2xl flex justify-between items-center border border-slate-700 shadow-lg">
                            <div>
                                <p class="text-sm text-blue-400 font-bold">${t.autor}</p>
                                <p class="text-slate-200">${t.texto}</p>
                            </div>
                            <button onclick="borrarTarea('${key}')" class="text-slate-500 hover:text-red-500 text-xl">✕</button>
                        </div>
                    `;
                });
            } else {
                lista.innerHTML = '<p class="text-center text-slate-600">No hay notas pendientes.</p>';
            }
        });

        // FUNCIÓN: Borrar tarea
        function borrarTarea(id) {
            db.ref('tareas/' + id).remove();
        }
    </script>
</body>
</html>
