<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tablero Familiar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 flex flex-col items-center">

    <div class="w-full max-w-md mt-10">
        <div class="text-center mb-8">
            <h1 id="saludo" class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
                Hola Familia 👋
            </h1>
            <p id="subtitulo" class="text-slate-400 mt-2">Tablero de organización</p>
        </div>

        <div class="glass border border-slate-700 rounded-3xl p-6 shadow-2xl mb-6">
            <div class="flex items-center gap-3 mb-4">
                <div class="bg-blue-500/20 p-2 rounded-lg text-blue-400">
                    📌
                </div>
                <h2 class="font-semibold text-lg text-blue-300">Notas de hoy</h2>
            </div>
            
            <div id="nota-container" class="bg-slate-800/50 rounded-2xl p-4 border border-slate-700/50">
                <p id="mensaje" class="text-slate-200 leading-relaxed">
                    Selecciona tu perfil para ver tus mensajes.
                </p>
            </div>
        </div>

        <button onclick="location.reload()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl transition-all active:scale-95 shadow-lg shadow-blue-900/20">
            🔄 Actualizar Tablero
        </button>

        <p class="text-center text-slate-600 text-xs mt-10 uppercase tracking-widest font-semibold">
            Familia Aplicaciones v1.0
        </p>
    </div>

    <script>
        // Lógica para personalizar según el usuario en la URL (?u=mati)
        const params = new URLSearchParams(window.location.search);
        const u = params.get('u')?.toLowerCase();
        
        const elSaludo = document.getElementById('saludo');
        const elMensaje = document.getElementById('mensaje');
        const elSubtitulo = document.getElementById('subtitulo');

        // Configuración de mensajes por persona
        const familia = {
            'mati': { 
                nombre: 'Mati', 
                msg: '¡A darle con todo a los proyectos hoy! No olvides revisar los commits pendientes.' 
            },
            'lis': { 
                nombre: 'Lis', 
                msg: '¡Hola Lis! Esperamos que tengas un día maravilloso y muy productivo. ❤️' 
            },
            'agus': { 
                nombre: 'Agus', 
                msg: '¡Hey Agus! Recuerda revisar tus tareas y dejar un tiempo para descansar.' 
            },
            'mia': { 
                nombre: 'Mia', 
                msg: '¡Hola peque! Recuerda que hoy es un gran día para aprender algo nuevo y jugar.' 
            }
        };

        if (familia[u]) {
            elSaludo.innerText = `¡Hola ${familia[u].nombre}! 👋`;
            elMensaje.innerText = familia[u].msg;
            elSubtitulo.innerText = "Este es tu espacio personal";
        }
    </script>
</body>
</html>
