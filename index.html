<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casa 🏠 - Calendario</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F5F4F0; --card: #FFFFFF; --primary: #1C1C2E; --accent: #FF4757;
            --text: #1C1C2E; --muted: #9A9A9A; --border: #EBEBEB;
            --u-mati: #4A90E2; --u-lis: #E84393; --u-agus: #9B59B6; --u-mia: #2ECC71;
            --radius: 18px; --shadow: 0 4px 20px rgba(0,0,0,0.07);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overscroll-behavior: none; }

        /* HEADER & STATS (Igual al tuyo) */
        .header { background: var(--primary); padding: 18px 16px 14px; display: flex; align-items: center; gap: 12px; }
        .avatar { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; border: 2px solid rgba(255,255,255,0.15); }
        .header-info { flex: 1; color: white; }
        .header-name { font-size: 20px; font-weight: 900; }
        .header-actions { display: flex; gap: 8px; }
        .btn-icon-header { background: rgba(255,255,255,0.12); border: none; border-radius: 12px; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }

        /* CALENDARIO ESTILOS */
        .cal-container { background: white; margin: 10px; border-radius: var(--radius); padding: 15px; box-shadow: var(--shadow); }
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: 900; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .cal-day-name { font-size: 10px; font-weight: 800; color: var(--muted); text-transform: uppercase; }
        .cal-day { padding: 10px 0; border-radius: 10px; font-size: 14px; font-weight: 700; position: relative; cursor: pointer; }
        .cal-day.today { background: var(--primary); color: white; }
        .cal-day.has-note::after { content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; background: var(--accent); border-radius: 50%; }
        .cal-day.selected { border: 2px solid var(--accent); }
        .cal-day.other-month { opacity: 0.3; }

        /* LISTA DE TAREAS DEL DÍA SELECCIONADO */
        .agenda-day { padding: 0 14px 20px; }
        .agenda-title { font-size: 14px; font-weight: 800; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; }

        /* NOTAS & TABLERO (Compacto para móvil) */
        .tablero { padding: 14px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 100px; }
        .nota { background: white; border-radius: var(--radius); padding: 15px; box-shadow: var(--shadow); border-left: 5px solid #ccc; position: relative; }
        .nota-user { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 10px; color: white; margin-bottom: 5px; display: inline-block; }
        .u-mati { background: var(--u-mati); } .u-lis { background: var(--u-lis); } .u-agus { background: var(--u-agus); } .u-mia { background: var(--u-mia); }
        .nota-content { font-size: 16px; font-weight: 700; margin: 5px 0; }
        .nota-foot { display: flex; gap: 8px; margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px; }
        .btn-check { flex: 1; background: #E8FDF0; border: none; padding: 8px; border-radius: 10px; color: #2ED573; font-weight: 800; }
        .btn-del { background: #FFEBEB; border: none; padding: 8px 15px; border-radius: 10px; color: var(--accent); }

        /* MODALES */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: flex-end; }
        .modal.open { display: flex; }
        .modal-sheet { background: white; width: 100%; border-radius: 20px 20px 0 0; padding: 20px; max-height: 90vh; overflow-y: auto; }
        .fab { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: var(--accent); color: white; border: none; font-size: 30px; box-shadow: 0 5px 15px rgba(255,71,87,0.4); }
        
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1.5px solid var(--border); font-family: inherit; font-weight: 700; }
        .btn-save { background: var(--primary); color: white; width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: 800; margin-top: 10px; }

        /* OCULTAR ELEMENTOS */
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="app">
    <div class="header">
        <div class="avatar" id="avatar">?</div>
        <div class="header-info">
            <div style="font-size: 11px; opacity: 0.7;">HOLA 👋</div>
            <div class="header-name" id="user-name">Cargando...</div>
        </div>
        <div class="header-actions">
            <button class="btn-icon-header" onclick="toggleVista('tablero')">📋</button>
            <button class="btn-icon-header" onclick="toggleVista('calendario')">📅</button>
        </div>
    </div>

    <div id="vista-tablero">
        <div id="lista-notas" class="tablero"></div>
    </div>

    <div id="vista-calendario" class="hidden">
        <div class="cal-container">
            <div class="cal-header">
                <button onclick="changeMonth(-1)" style="border:none; background:none; font-size:20px;">‹</button>
                <div id="cal-month-year">Mes Año</div>
                <button onclick="changeMonth(1)" style="border:none; background:none; font-size:20px;">›</button>
            </div>
            <div class="cal-grid" id="cal-grid"></div>
        </div>
        <div class="agenda-day">
            <div class="agenda-title" id="agenda-date-label">Selecciona un día</div>
            <div id="agenda-notas"></div>
        </div>
    </div>

    <button class="fab" onclick="abrirModal()">＋</button>
</div>

<div class="modal" id="modal-nota">
    <div class="modal-sheet">
        <h2 id="modal-title">Nueva Nota</h2>
        <input type="hidden" id="f-id">
        <select id="f-cat">
            <option value="casa">🏠 Casa</option>
            <option value="super">🛒 Súper</option>
            <option value="urgente">🚨 Urgente</option>
            <option value="eventos">🎉 Eventos</option>
            <option value="pagos">💰 Pagos</option>
        </select>
        <textarea id="f-txt" placeholder="¿Qué hay que hacer?"></textarea>
        <input type="date" id="f-fecha">
        <button class="btn-save" onclick="guardar()">Guardar Nota</button>
        <button onclick="cerrarModal()" style="width:100%; background:none; border:none; padding:10px; color:var(--muted); font-weight:700;">Cancelar</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDG6icP-ZCbtMouvxb90OwI1cmse56fnjs",
        authDomain: "app-family-notas.firebaseapp.com",
        databaseURL: "https://app-family-notas-default-rtdb.firebaseio.com",
        projectId: "app-family-notas",
        storageBucket: "app-family-notas.firebasestorage.app",
        messagingSenderId: "1043185917487",
        appId: "1:1043185917487:web:5ec89f80b6f726e99270da"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const userKey = (new URLSearchParams(window.location.search).get('u') || '').toLowerCase();
    const esAdmin = (userKey === 'mati' || userKey === 'lis');
    const perfiles = { mati: '👨🏻‍💻', lis: '👩🏻‍🍳', agus: '👧🏻', mia: '👩🏻‍🎓' };

    let notas = [];
    let currentMonth = new Date().getMonth();
    let currentYear = new Date().getFullYear();
    let selectedDate = new Date().toISOString().split('T')[0];

    // INICIO
    if(perfiles[userKey]) {
        document.getElementById('user-name').innerText = userKey.toUpperCase();
        document.getElementById('avatar').innerText = perfiles[userKey];
        onValue(ref(db, 'pendientes'), (snapshot) => {
            const data = snapshot.val();
            notas = data ? Object.keys(data).map(id => ({id, ...data[id]})) : [];
            renderTablero();
            renderCalendario();
            renderAgenda(selectedDate);
        });
    }

    // NAVEGACIÓN
    window.toggleVista = (vista) => {
        document.getElementById('vista-tablero').classList.toggle('hidden', vista !== 'tablero');
        document.getElementById('vista-calendario').classList.toggle('hidden', vista !== 'calendario');
    };

    // RENDER LISTA NORMAL
    function renderTablero() {
        const container = document.getElementById('lista-notas');
        container.innerHTML = notas.map(n => cardHtml(n)).join('');
    }

    // CARD HTML (Reutilizable)
    function cardHtml(n) {
        return `
            <div class="nota" style="border-left-color: var(--cat-${n.categoria})">
                <span class="nota-user u-${n.autor}">${n.autor}</span>
                <div class="nota-content" onclick="editar('${n.id}')">${n.contenido}</div>
                ${n.limite ? `<div style="font-size:11px; color:var(--accent); font-weight:800;">📅 ${n.limite}</div>` : ''}
                <div class="nota-foot">
                    ${esAdmin ? `
                        <button class="btn-check" onclick="eliminar('${n.id}')">✓ Terminar</button>
                        <button class="btn-del" onclick="eliminar('${n.id}')">🗑️</button>
                    ` : `<div style="font-size:11px; color:var(--muted)">🔒 Solo Papá/Mamá</div>`}
                </div>
            </div>`;
    }

    // CALENDARIO LÓGICA
    window.changeMonth = (dir) => {
        currentMonth += dir;
        if(currentMonth < 0) { currentMonth = 11; currentYear--; }
        if(currentMonth > 11) { currentMonth = 0; currentYear++; }
        renderCalendario();
    };

    function renderCalendario() {
        const grid = document.getElementById('cal-grid');
        const monthLabel = document.getElementById('cal-month-year');
        const names = ['DOM','LUN','MAR','MIE','JUE','VIE','SAB'];
        const months = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
        
        monthLabel.innerText = `${months[currentMonth]} ${currentYear}`;
        grid.innerHTML = names.map(n => `<div class="cal-day-name">${n}</div>`).join('');

        const firstDay = new Date(currentYear, currentMonth, 1).getDay();
        const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

        for(let i = 0; i < firstDay; i++) grid.innerHTML += `<div class="cal-day other-month"></div>`;

        for(let d = 1; d <= daysInMonth; d++) {
            const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const hasNote = notas.some(n => n.limite === dateStr);
            const isToday = new Date().toISOString().split('T')[0] === dateStr;
            
            grid.innerHTML += `
                <div class="cal-day ${isToday?'today':''} ${hasNote?'has-note':''} ${selectedDate === dateStr?'selected':''}" 
                     onclick="selectDate('${dateStr}')">
                    ${d}
                </div>`;
        }
    }

    window.selectDate = (date) => {
        selectedDate = date;
        renderCalendario();
        renderAgenda(date);
    };

    function renderAgenda(date) {
        const container = document.getElementById('agenda-notas');
        const label = document.getElementById('agenda-date-label');
        const tareasDia = notas.filter(n => n.limite === date);
        
        label.innerText = `Tareas para el ${date.split('-').reverse().join('/')}`;
        container.innerHTML = tareasDia.length ? tareasDia.map(n => cardHtml(n)).join('') : '<p style="text-align:center; padding:20px; color:var(--muted)">Sin eventos para hoy</p>';
    }

    // CRUD
    window.abrirModal = () => {
        document.getElementById('f-id').value = "";
        document.getElementById('f-txt').value = "";
        document.getElementById('modal-nota').classList.add('open');
    };

    window.cerrarModal = () => document.getElementById('modal-nota').classList.remove('open');

    window.editar = (id) => {
        const n = notas.find(x => x.id === id);
        document.getElementById('f-id').value = n.id;
        document.getElementById('f-txt').value = n.contenido;
        document.getElementById('f-fecha').value = n.limite || "";
        document.getElementById('modal-nota').classList.add('open');
    };

    window.guardar = () => {
        const id = document.getElementById('f-id').value;
        const data = {
            contenido: document.getElementById('f-txt').value,
            categoria: document.getElementById('f-cat').value,
            limite: document.getElementById('f-fecha').value,
            autor: userKey
        };
        if(!data.contenido) return;
        id ? update(ref(db, `pendientes/${id}`), data) : push(ref(db, 'pendientes'), data);
        cerrarModal();
    };

    window.eliminar = (id) => {
        if(confirm("¿Completada o eliminar?")) remove(ref(db, `pendientes/${id}`));
    };
</script>
</body>
</html>
