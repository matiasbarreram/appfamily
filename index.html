<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tablero Familiar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen">
    <div class="bg-slate-800 p-10 rounded-3xl shadow-xl border border-slate-700 text-center">
        <h1 id="saludo" class="text-4xl font-bold text-blue-400 mb-4">Hola Familia 👋</h1>
        <p id="mensaje" class="text-slate-300">Cargando tablero...</p>
    </div>
    <script>
        const u = new URLSearchParams(window.location.search).get('u');
        const nombres = {'mati':'Mati', 'lis':'Lis', 'agus':'Agus', 'mia':'Mia'};
        if(u && nombres[u.toLowerCase()]) {
            document.getElementById('saludo').innerText = 'Hola ' + nombres[u.toLowerCase()] + ' 👋';
            document.getElementById('mensaje').innerText = '¡Tu tablero está listo!';
        }
    </script>
</body>
</html>
