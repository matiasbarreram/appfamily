<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>App Familiar + Calendario</title>
</head>
<body>

<!-- NOTA: Este archivo es una versión simplificada con calendario integrado -->

<button onclick="abrirCalendario()">📅 Abrir Calendario</button>

<div id="calendario" style="margin-top:20px;"></div>
<div id="detalle"></div>

<script>
let notas = [
 {contenido:"Ir al médico", limite:"2026-05-02", icono:"🏥"},
 {contenido:"Comprar pan", limite:"2026-05-02", icono:"🍞"},
 {contenido:"Pagar cuentas", limite:"2026-05-05", icono:"💰"}
];

function abrirCalendario(){
 renderCalendario();
}

function renderCalendario(){
 const cont = document.getElementById("calendario");
 const hoy = new Date();
 const año = hoy.getFullYear();
 const mes = hoy.getMonth();

 const diasMes = new Date(año, mes+1, 0).getDate();

 cont.innerHTML = "";

 for(let d=1; d<=diasMes; d++){
   const fecha = `${año}-${String(mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
   const tiene = notas.some(n=>n.limite===fecha);

   cont.innerHTML += `<div onclick="verDia('${fecha}')"
   style="display:inline-block;width:40px;margin:4px;padding:6px;
   background:${tiene?'black':'#ddd'};color:${tiene?'white':'black'};
   cursor:pointer;text-align:center">${d}</div>`;
 }
}

function verDia(fecha){
 const lista = notas.filter(n=>n.limite===fecha);
 const det = document.getElementById("detalle");

 if(!lista.length){
   det.innerHTML = "Sin notas";
   return;
 }

 det.innerHTML = lista.map(n=>`${n.icono} ${n.contenido}`).join("<br>");
}
</script>

</body>
</html>
