<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tablero Familiar</title>
    <style>
        body { background: #1a202c; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: screen; margin: 0; height: 100vh; }
        .card { background: #2d3748; padding: 2rem; rounded: 1rem; border: 1px solid #4a5568; text-align: center; border-radius: 20px; }
        h1 { color: #63b3ed; }
    </style>
</head>
<body>
    <div class="card">
        <h1 id="saludo">Hola Familia 👋</h1>
        <p id="mensaje">Tu tablero está activo.</p>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const u = params.get('u');
        const nombres = {'mati':'Mati', 'lis':'Lis', 'agus':'Agus', 'mia':'Mia'};
        if(u && nombres[u.toLowerCase()]) {
            document.getElementById('saludo').innerText = 'Hola ' + nombres[u.toLowerCase()] + ' 👋';
        }
    </script>
</body>
</html>
